<!doctype html>
{{generated}}
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.description}}">
<!-- language before first paint: the main page redirects to the reader's language (explainers/lang.js) -->
<script src="{{root}}explainers/lang.js"></script>
<link rel="stylesheet" href="{{root}}explainers/landing.css">
{{js}}
<script type="module" src="{{root}}explainers/catalog/catalog.js"></script>
</head>
<body class="catalog">
<main class="page">
  <header class="top">
    <span class="mono">Explainer</span>
    <div class="tools"><a class="gh mono" href="{{repo}}" rel="noopener" title="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a><nav class="langs mono" aria-label="{{nav.language}}">{{langSwitch}}</nav></div>
  </header>
  <div class="hero">
    <div class="eyebrow mono">Explainer</div>
    <h1>{{hero.h1}}</h1>
    <p class="lede">{{hero.lede}}</p>
  </div>

  <section>
    <div class="sec-head mono"><span class="n">01</span><span>{{topics}}</span></div>
    <div class="cards">
      {{cards}}
    </div>
  </section>

  <section>
    <div class="sec-head mono"><span class="n">02</span><span>{{how.kicker}}</span></div>
    <div class="facts"><!--each how.list--><div class="fact"><span class="mono">{{.0}}</span><h3>{{.1}}</h3><p>{{.2}}</p></div><!--/each--></div>
  </section>
  <p class="foot">{{foot}}</p>
  <p class="foot src">Explainer · <a href="{{repo}}">github.com/nemilya/explainer</a></p>
</main>
</body>
</html>
