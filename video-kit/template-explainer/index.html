<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Explainer</title>
<meta name="description" content="{{TITLE}}: живая изометрическая фигура, ролик-диалог и объяснение.">
<link rel="stylesheet" href="{{ROOT}}/anatomy/kit/iso.css">
<link rel="stylesheet" href="../landing.css">
<script type="module" src="landing.js"></script>
</head>
<body class="iso" data-theme="light">
<main class="page">
  <header class="top">
    <a class="mono" href="{{ROOT}}/" data-t="catalog">← Explainer</a>
    <div class="langs mono"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
  </header>
  <div class="hero">
    <div class="eyebrow mono" data-t="eyebrow"></div>
    <h1 data-t="h1"></h1>
    <p class="lede" data-t="lede"></p>
    <ul class="questions" data-t="questions"></ul>
  </div>
  <section id="machine">
    <div class="sec-head mono"><span class="n">01</span><span data-t="s1kicker"></span></div>
    <h2 data-t="s1h"></h2>
    <figure class="iso-figure">
      <div class="iso-plate">
        <div class="iso-plate-corners" aria-hidden="true">
          <span class="iso-plate-corner" data-corner="fig">Fig 1</span>
          <span class="iso-plate-corner" data-corner="title" data-t="figTitle"></span>
          <span class="iso-plate-corner" data-corner="hint" data-t="figHint"></span>
          <span class="iso-plate-corner" data-corner="readout" data-readout></span>
        </div>
        <div class="iso-stage" tabindex="0" role="img"></div>
      </div>
      <figcaption class="iso-legend"><span class="iso-caption" data-t="caption"></span></figcaption>
    </figure>
  </section>
  <section id="video">
    <div class="sec-head mono"><span class="n">02</span><span data-t="s2kicker"></span></div>
    <h2 data-t="s2h"></h2>
    <div class="vtabs">
      <div class="seg" role="group" id="fmt"><button type="button" data-f="h">16:9</button><button type="button" data-f="v">9:16</button></div>
      <a class="btn ghost" id="live" target="_blank" rel="noopener" data-t="live"></a>
    </div>
    <div class="video" id="player"></div>
  </section>
  <section id="facts">
    <div class="sec-head mono"><span class="n">03</span><span data-t="s3kicker"></span></div>
    <h2 data-t="s3h"></h2>
    <div class="facts" data-t="facts"></div>
  </section>
</main>
</body>
</html>
